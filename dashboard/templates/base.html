<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threat Intel Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script>
      window.THREAT_INTEL_DASHBOARD = {
        apiKey: "{{ api_key | default('') }}",
        refreshSeconds: {{ refresh_seconds | default(60) }}
      };
    </script>
    <script src="/static/charts.js" defer></script>
  </head>
  <body>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>
    <header class="app-header">
      <div class="header-brand">
        <h1>Threat Intel Correlation Engine</h1>
        <p>Confidence arbitration across multi-source IOC feeds</p>
      </div>
      <nav>
        <a href="/dashboard">Overview</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
