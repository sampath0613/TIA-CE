services:
  postgres:
    image: postgres:15
    container_name: threat-intel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-threatintel}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-threatintel}
      POSTGRES_DB: ${DATABASE_NAME:-threatintel}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-threatintel} -d ${DATABASE_NAME:-threatintel}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
